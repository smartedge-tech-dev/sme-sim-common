# Release on a v* tag: Windows onefile exe + GitHub Release (notes from CHANGELOG.md) + PyPI.
# PyPI trusted publishing trusts exactly this workflow file name (release.yml) and the
# environment name (pypi). Keep both names, and register them on PyPI before the first tag
# (see sme-sim-common templates/CHECKLIST.md).
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  windows-exe:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install . pyinstaller
      - run: pyinstaller packaging/{{dist_name}}.spec --noconfirm
      - name: Rename artifact with version
        shell: bash
        run: mv dist/{{dist_name}}.exe "dist/{{dist_name}}-${GITHUB_REF_NAME}-windows.exe"
      - name: Extract release notes from CHANGELOG.md
        id: notes
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v ver="$ver" '
            /^## \[/ { if (found) exit; if (index($0, "## [" ver "]") == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if grep -q '[^[:space:]]' release-notes.md; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "No CHANGELOG.md section for $ver; falling back to generated notes"
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/{{dist_name}}-*-windows.exe
          body_path: ${{ steps.notes.outputs.found == 'true' && 'release-notes.md' || '' }}
          generate_release_notes: ${{ steps.notes.outputs.found != 'true' }}

  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1

  # ---------------------------------------------------------------------------------------------
  # Optional: multi-arch Docker image on ghcr.io. Uncomment only for products that ship an image
  # (SME BACnetSim does; SME SerialHub does not - it needs host serial / virtual COM ports, so it is
  # not released as a container). Needs a Dockerfile at the repo root.
